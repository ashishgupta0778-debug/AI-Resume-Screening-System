# Netlify Configuration for AI-Based Resume Screening System

[build]
  # Directory containing the static HTML/CSS/JS frontend
  publish = "frontend"

# Redirect root to login page
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 302

# Proxy backend API requests to live FastAPI backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://ai-resume-screening-system.onrender.com/api/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/screen-*"
  to = "https://ai-resume-screening-system.onrender.com/screen-:splat"
  status = 200
  force = false
